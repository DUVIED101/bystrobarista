# Place at: /etc/nginx/conf.d/00-bystrobarista-tuning.conf (http context).
# Rate-limit zone used by nginx-api.conf: 30 req/s per client IP.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# Auth endpoints that check or send one-time codes, and password sign-in.
# A 6-digit code must not be guessable at the general 30 r/s. Requests relayed
# by the LT proxy (185.81.166.243) are limited there per real client IP, so
# they get an empty key here (empty keys are not limited).
map $remote_addr $bb_auth_key {
    185.81.166.243 "";
    default        $binary_remote_addr;
}
limit_req_zone $bb_auth_key zone=auth_code:10m rate=10r/m;
limit_req_zone $bb_auth_key zone=auth_token:10m rate=60r/m;
