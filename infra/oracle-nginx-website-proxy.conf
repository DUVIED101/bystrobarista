# Russia-reachable proxy for the marketing site (bystrobarista.com).
#
# Place at: /etc/nginx/sites-available/website-proxy
# Symlink:  ln -s /etc/nginx/sites-available/website-proxy /etc/nginx/sites-enabled/
# Reload:   nginx -t && systemctl reload nginx
#
# Lives on the same Time4VPS/RackRay Lithuania VM (185.81.166.243) that fronts
# api.bystrobarista.com — see oracle-nginx-supabase-proxy.conf. (Filename kept
# for git history; we no longer run on Oracle Frankfurt.) The marketing site
# is hosted on Vercel, which is intermittently blocked by RKN — this server
# block lets RU users reach bystrobarista.com through the LT VM.
#
# DNS prerequisite: bystrobarista.com (and www) A-record points at the VM's
# public IP, NOT at Vercel's edge. Vercel routes by Host header, so once the
# upstream request lands at Vercel with `Host: bystrobarista.com` the right
# deployment is served. Keep the domain attached to the Vercel project so its
# cert/edge routing stays valid for direct hits (e.g. from non-RU users via
# Vercel's own DNS once they remove A-record after migration — currently both
# co-exist while we measure).

# TTL kept short (10s) so a stale Vercel edge IP rotates out of nginx's
# resolver cache quickly. cname.vercel-dns.com returns 2 IPs; if one edge is
# briefly unhealthy, users hitting the cached-bad IP get 502 until TTL expires.
resolver 1.1.1.1 8.8.8.8 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 443 ssl http2;
    server_name bystrobarista.com www.bystrobarista.com;
    access_log /var/log/nginx/bystrobarista.access.log vercel_debug;
    error_log  /var/log/nginx/bystrobarista.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/bystrobarista.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bystrobarista.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Vercel routes custom-domain traffic by the inbound Host header — keep the
    # user's original $host so the right project deployment is served. The
    # CNAME target rotates IPs on Vercel's side, which is why we resolve in a
    # variable + use a recursive resolver above (otherwise nginx caches the IP
    # at startup and stops working when Vercel changes edges).
    set $vercel_upstream "cname.vercel-dns.com";

    location / {
        proxy_pass https://$vercel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        # SNI must match the public domain (bystrobarista.com), not the CNAME —
        # Vercel picks the cert by SNI and would otherwise hand us
        # cname.vercel-dns.com's cert.
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Fast failure detection — a dead Vercel edge fails in 5s not 60s.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Buffer Vercel's response so nginx can release the upstream TCP socket
        # quickly and drip to the client — without this, a slow client keeps a
        # worker+upstream conn pinned and 957MB RAM VPS starts thrashing.
        # No SSE/streaming on this apex domain (Realtime WebSockets ride the
        # separate api.bystrobarista.com server block), so buffering is safe.
        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 0;

        # Retry a failed request against a fresh DNS re-resolution — up to 3
        # attempts within 15s. Default proxy_next_upstream does NOT retry POST,
        # which is what we want (verifyOtp POSTs must never be replayed).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;

        # Two-tier retry chain — each internal location has its own set-var so
        # nginx re-runs the resolver and possibly gets a different Vercel edge
        # IP. The original single @vercel_retry re-used the same $vercel_upstream
        # value already resolved by location /, defeating the purpose.
        proxy_intercept_errors on;
        error_page 502 503 504 = @vercel_retry;
    }

    location @vercel_retry {
        internal;
        set $vercel_retry_upstream "cname.vercel-dns.com";
        proxy_pass https://$vercel_retry_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 0;

        proxy_intercept_errors on;
        error_page 502 503 504 = @vercel_retry_final;
    }

    location @vercel_retry_final {
        internal;
        set $vercel_final_upstream "cname.vercel-dns.com";
        proxy_pass https://$vercel_final_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 0;
    }
}

server {
    listen 80;
    server_name bystrobarista.com www.bystrobarista.com;
    access_log /var/log/nginx/bystrobarista.access.log vercel_debug;
    error_log  /var/log/nginx/bystrobarista.error.log warn;

    # Let's Encrypt HTTP-01 must be answered over plain HTTP: the 301 into the
    # TLS vhost only works while the old certificate is still valid, which is
    # exactly what is missing once it has expired. Renewal uses
    # `--webroot -w /var/www/html`, never standalone (nginx owns port 80).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
